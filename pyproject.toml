[project]
name = "blueoceansp-full-stack"
version = "0.1.0"
description = "Assessment project: Django + HTMX + Alpine.js"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "django-htmx>=1.21",
    "django-q2>=1.11.1",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.8",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
    "whitenoise>=6.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
python_files = ["test_*.py", "*_tests.py", "tests.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "DJ"]
ignore = ["DJ001"]  # null=True on model fields is fine

[tool.ruff.lint.per-file-ignores]
# Vendored verbatim from the assignment harness — never restyled.
"**/capex/harness/**" = ["ALL"]
